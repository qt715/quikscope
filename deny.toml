[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "x86_64-apple-darwin", "aarch64-apple-darwin"]

[advisories]
unmaintained = "all"
ignore = [
  # paste: unmaintained, no vulnerability; inherited through GPUI/metal/image.
  "RUSTSEC-2024-0436",
  # rustybuzz: unmaintained, no vulnerability; harfrust migration reworks shaping.
  "RUSTSEC-2026-0206",
  # ttf-parser: unmaintained, no vulnerability; skrifa migration reworks font metrics.
  "RUSTSEC-2026-0192",
  # zbus_names: unmaintained, no vulnerability; GPUI's D-Bus stack still uses zbus 5.
  "RUSTSEC-2026-0371",
  # zvariant: unmaintained, no vulnerability; GPUI's D-Bus stack still uses zbus 5.
  "RUSTSEC-2026-0370",
  # zvariant_derive: unmaintained, no vulnerability; follows the same zbus 5 stack.
  "RUSTSEC-2026-0372",
]

[licenses]
confidence-threshold = 0.8
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "BSL-1.0", "CC0-1.0", "0BSD", "Apache-2.0 WITH LLVM-exception", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

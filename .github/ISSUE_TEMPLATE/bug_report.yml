name: Bug report
description: Report incorrect behavior or a crash
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, use private reporting in SECURITY.md. Review logs and screenshots for private data before attaching them."
  - type: input
    id: version
    attributes:
      label: Version
      description: Release version or commit hash
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: OS, desktop and capture backend
      description: Include OS version, desktop/compositor and the daemon log line containing `platform backend:`. Add monitor scales/layout when relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the command/configuration and what happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove personal paths, screenshots and extracted text that should not be public.

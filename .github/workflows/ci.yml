name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Nothing in CI reads debug info; dropping it keeps caches and links small.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System dependencies
        run: scripts/ci-deps-ubuntu.sh
      - run: cargo fmt --all --check
      # `e2e` pulls in the test helper binary and suite, so they are linted too.
      - run: cargo clippy --locked --all-targets --features e2e -- --deny warnings

  test:
    name: Unit, regression and rendering tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System dependencies (incl. Mesa lavapipe for offscreen GPUI rendering)
        run: scripts/ci-deps-ubuntu.sh
      - name: Fonts for the shaping and fallback tests (CJK, Arabic, Hebrew, Devanagari, emoji)
        run: sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji
      # One Chinese variant only: Debian's fast models read simplified text as
      # traditional when both are installed (see docs/text-extraction.md).
      - name: Tesseract and language models for the text extraction tests
        run: |
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng \
            tesseract-ocr-jpn tesseract-ocr-chi-sim tesseract-ocr-kor tesseract-ocr-ara \
            tesseract-ocr-tha tesseract-ocr-vie tesseract-ocr-deu
      - name: Tests
        env:
          # Script and OCR tests fail instead of skipping when a font,
          # Tesseract or a language model is missing.
          QUIKSCOPE_REQUIRE_FONTS: "1"
          QUIKSCOPE_REQUIRE_OCR: "1"
        run: cargo test --locked
      - name: Upload regression diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-diffs
          path: /tmp/quikscope-*.png
          if-no-files-found: ignore

  windows:
    name: Windows build, clippy and non-GPU tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --release
      - run: cargo clippy --locked --all-targets -- --deny warnings
      # GPUI 0.3.10 returns no headless renderer on Windows. The two
      # offscreen GPU suites are cfg-excluded; lib, CLI, golden and OCR run.
      - run: cargo test --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/quikscope | Out-Null
          Copy-Item target/release/quikscope.exe, README.md, LICENSE-MIT, LICENSE-APACHE dist/quikscope/
          Compress-Archive dist/quikscope quikscope-x86_64-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: quikscope-x86_64-windows
          path: quikscope-x86_64-windows.zip

  macos:
    name: macOS dual-architecture build, ARM64 tests and capture smoke
    # macos-14 is retired; macos-15 is the supported standard ARM64 image.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          target: x86_64-apple-darwin
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Require native ARM64 runner
        run: test "$(uname -m)" = arm64
      - name: Native OCR runtime
        run: brew install tesseract
      - name: Resolve bundled UI font through CoreText
        run: |
          xcrun swift - "$PWD/assets/fonts/InterVariable.ttf" <<'SWIFT'
          import CoreText
          import Foundation
          let url = URL(fileURLWithPath: CommandLine.arguments[1]) as CFURL
          guard let descriptors = CTFontManagerCreateFontDescriptorsFromURL(url) as? [CTFontDescriptor],
                let descriptor = descriptors.first,
                let reported = CTFontDescriptorCopyAttribute(descriptor, kCTFontFamilyNameAttribute) as? String else {
              fatalError("CoreText could not read the bundled Inter font")
          }
          print("Bundled CoreText family: \(reported)")
          precondition(reported == "Inter Variable", "CoreText family differs from UI_FONT")
          precondition(CTFontManagerRegisterFontsForURL(url, .process, nil), "CoreText font registration failed")
          let resolved = CTFontCreateWithName("Inter Variable" as CFString, 14, nil)
          let family = CTFontCopyFamilyName(resolved) as String
          print("CoreText resolves UI_FONT to: \(family)")
          precondition(family == "Inter Variable", "UI_FONT resolved to a fallback font")
          SWIFT
      - run: cargo build --locked --release
      - name: Compile Intel macOS release
        run: cargo build --locked --release --target x86_64-apple-darwin
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check native regression sensitivity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          mutations = [
              ("src/platform/macos/desktop.rs", "bounds.origin.x.floor()", "bounds.origin.x.ceil()",
               "desktop_bounds_preserve_negative_origins_and_outward_rounding"),
              ("src/platform/macos/shell.rs", '"cmd" | "command" | "super" | "win" => 1 << 8,',
               '"cmd" | "command" | "super" | "win" => 1 << 7,',
               "macos_hotkeys_validate_modifiers_keys_and_collisions"),
              ("src/platform/macos/capture.rs", "status == Some(SCFrameStatus::Complete.0)",
               "status.is_some()", "only_complete_frames_are_accepted"),
              ("src/fonts.rs", ".any(|(name, _)| name.starts_with('.'))",
               ".any(|(_name, _)| false)", "family_list_starts_with_inter_and_has_no_duplicates"),
          ]
          for filename, before, after, test in mutations:
              path = Path(filename)
              original = path.read_text()
              assert original.count(before) == 1, f"Mutation target changed: {filename}"
              try:
                  path.write_text(original.replace(before, after))
                  result = subprocess.run(["cargo", "test", "--locked", "--lib", test],
                                          text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  print(result.stdout, flush=True)
                  assert result.returncode != 0 and "test result: FAILED." in result.stdout, \
                      f"{test} did not reject its behavioral mutation"
              finally:
                  path.write_text(original)
          PY
      # GPUI 0.3.10 supplies a Metal headless renderer on macOS, so retain
      # GPU rendering tests rather than applying the Windows exclusions.
      - run: cargo test --locked
      - name: Require real English OCR
        env:
          QUIKSCOPE_REQUIRE_OCR: "1"
        run: cargo test --locked --test ocr a_region_reads_only_what_it_covers_and_maps_back
      - name: Assemble app
        run: packaging/macos/assemble-app.sh target/release/quikscope dist/quikscope.app
      - name: ScreenCaptureKit daemon smoke
        run: packaging/macos/ci-smoke.sh "$GITHUB_WORKSPACE/dist/quikscope.app"
      - name: Upload capture and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quikscope-macos-arm64-smoke
          path: ${{ runner.temp }}/quikscope-smoke
          if-no-files-found: warn
      - name: Archive app
        run: ditto -c -k --sequesterRsrc --keepParent dist/quikscope.app dist/quikscope-arm64-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: quikscope-arm64-macos
          path: dist/quikscope-arm64-macos.zip

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          toolchain: ${{ steps.msrv.outputs.version }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System dependencies
        run: scripts/ci-deps-ubuntu.sh
      - run: cargo check --locked --all-targets

  e2e:
    name: End-to-end (headless labwc)
    runs-on: ubuntu-24.04
    # Arch ships the same labwc/wlroots generation the suite is developed
    # against; Ubuntu's labwc lags several releases behind.
    container:
      image: archlinux:latest
    steps:
      - name: System dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rustup labwc grim dbus \
            mesa vulkan-swrast wayland libxkbcommon libxkbcommon-x11 fontconfig tesseract tesseract-data-eng
          rustup default stable
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: End-to-end suite
        env:
          QUIKSCOPE_E2E: "1"
          QUIKSCOPE_E2E_COMPOSITOR: labwc
          QUIKSCOPE_REQUIRE_OCR: "1"
        run: cargo test --locked --features e2e --test e2e -- --test-threads=4
      - name: Collect failed sessions
        if: failure()
        run: tar czf /tmp/e2e-failures.tgz --exclude='*.sock' --exclude=bus /tmp/quikscope-e2e* || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: /tmp/e2e-failures.tgz
          if-no-files-found: ignore

  x11-e2e:
    name: End-to-end (private Xvfb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System dependencies
        run: |
          scripts/ci-deps-ubuntu.sh
          sudo apt-get install -y --no-install-recommends xvfb x11-utils
      - name: X11 end-to-end suite
        env:
          QUIKSCOPE_E2E: "1"
        run: cargo test --locked --features e2e --test x11_e2e

  release:
    name: Release build
    runs-on: ubuntu-24.04
    needs: [lint, test, windows, e2e, x11-e2e]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System dependencies
        run: scripts/ci-deps-ubuntu.sh
      - run: cargo build --locked --release
      - name: Package
        run: |
          mkdir -p dist/quikscope
          cp target/release/quikscope packaging/quikscope.service packaging/quikscope.desktop \
            README.md LICENSE-MIT LICENSE-APACHE dist/quikscope/
          tar -C dist -czf quikscope-x86_64-linux.tar.gz quikscope
      - uses: actions/upload-artifact@v4
        with:
          name: quikscope-x86_64-linux
          path: quikscope-x86_64-linux.tar.gz
      - name: Windows package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v4
        with:
          name: quikscope-x86_64-windows
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            quikscope-x86_64-linux.tar.gz
            quikscope-x86_64-windows.zip

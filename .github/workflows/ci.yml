name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Nothing in CI reads debug info; dropping it keeps caches and links small.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System dependencies
        run: scripts/ci-deps-ubuntu.sh
      - run: cargo fmt --all --check
      # `e2e` pulls in the test helper binary and suite, so they are linted too.
      - run: cargo clippy --locked --all-targets --features e2e -- --deny warnings

  test:
    name: Unit, regression and rendering tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System dependencies (incl. Mesa lavapipe for offscreen GPUI rendering)
        run: scripts/ci-deps-ubuntu.sh
      - name: Fonts for the shaping and fallback tests (CJK, Arabic, Hebrew, Devanagari, emoji)
        run: sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji
      # One Chinese variant only: Debian's fast models read simplified text as
      # traditional when both are installed (see docs/text-extraction.md).
      - name: Tesseract and language models for the text extraction tests
        run: |
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng \
            tesseract-ocr-jpn tesseract-ocr-chi-sim tesseract-ocr-kor tesseract-ocr-ara \
            tesseract-ocr-tha tesseract-ocr-vie tesseract-ocr-deu
      - name: Tests
        env:
          # Script and OCR tests fail instead of skipping when a font,
          # Tesseract or a language model is missing.
          QUICKSCOPE_REQUIRE_FONTS: "1"
          QUICKSCOPE_REQUIRE_OCR: "1"
        run: cargo test --locked
      - name: Upload regression diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-diffs
          path: /tmp/quickscope-*.png
          if-no-files-found: ignore

  windows:
    name: Windows build, clippy and non-GPU tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --release
      - run: cargo clippy --locked --all-targets -- --deny warnings
      # GPUI 0.3.10 returns no headless renderer on Windows. The two
      # offscreen GPU suites are cfg-excluded; lib, CLI, golden and OCR run.
      - run: cargo test --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/quickscope | Out-Null
          Copy-Item target/release/quickscope.exe, README.md, LICENSE-MIT, LICENSE-APACHE dist/quickscope/
          Compress-Archive dist/quickscope quickscope-x86_64-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: quickscope-x86_64-windows
          path: quickscope-x86_64-windows.zip

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System dependencies
        run: scripts/ci-deps-ubuntu.sh
      - run: cargo check --locked --all-targets

  e2e:
    name: End-to-end (headless labwc)
    runs-on: ubuntu-24.04
    # Arch ships the same labwc/wlroots generation the suite is developed
    # against; Ubuntu's labwc lags several releases behind.
    container:
      image: archlinux:latest
    steps:
      - name: System dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rustup labwc grim dbus \
            mesa vulkan-swrast wayland libxkbcommon fontconfig tesseract tesseract-data-eng
          rustup default stable
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: End-to-end suite
        env:
          QUICKSCOPE_E2E: "1"
          QUICKSCOPE_E2E_COMPOSITOR: labwc
          QUICKSCOPE_REQUIRE_OCR: "1"
        run: cargo test --locked --features e2e --test e2e -- --test-threads=4

  x11-e2e:
    name: End-to-end (private Xvfb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System dependencies
        run: |
          scripts/ci-deps-ubuntu.sh
          sudo apt-get install -y --no-install-recommends xvfb x11-utils
      - name: X11 end-to-end suite
        env:
          QUICKSCOPE_E2E: "1"
        run: cargo test --locked --features e2e --test x11_e2e

  release:
    name: Release build
    runs-on: ubuntu-24.04
    needs: [lint, test, windows, e2e, x11-e2e]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System dependencies
        run: scripts/ci-deps-ubuntu.sh
      - run: cargo build --locked --release
      - name: Package
        run: |
          mkdir -p dist/quickscope
          cp target/release/quickscope packaging/quickscope.service packaging/quickscope.desktop \
            README.md LICENSE-MIT LICENSE-APACHE dist/quickscope/
          tar -C dist -czf quickscope-x86_64-linux.tar.gz quickscope
      - uses: actions/upload-artifact@v4
        with:
          name: quickscope-x86_64-linux
          path: quickscope-x86_64-linux.tar.gz
      - name: Windows package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v4
        with:
          name: quickscope-x86_64-windows
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            quickscope-x86_64-linux.tar.gz
            quickscope-x86_64-windows.zip
